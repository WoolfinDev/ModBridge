name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller
      - run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with: { name: ModBridge-windows, path: dist/ModBridge.exe }

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-venv libgl1 libegl1 libfontconfig1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sh packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: ModBridge-linux, path: dist/ModBridge }

  github-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ModBridge-windows/ModBridge.exe
            artifacts/ModBridge-linux/ModBridge
